<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>页面不存在 · 知识库</title>
<style>
  :root { color-scheme: light dark; --bg: light-dark(#eef0ed, #0a0e10); --ink: light-dark(#171c1e, #e8ebe6); --ink-2: light-dark(#4e595b, #a9b2ad); --ink-3: light-dark(#7e8988, #77827e); --line: light-dark(#cdd3cd, #273235); --copper: light-dark(#a34b28, #dd8a63); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { width: min(100%, 560px); border-top: 1px solid var(--line); padding-top: 24px; }
  .code { margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: .68rem; letter-spacing: .08em; color: var(--copper); }
  h1 { margin: 18px 0 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif; font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1.15; font-weight: 600; }
  p { margin: 16px 0 0; color: var(--ink-2); line-height: 1.8; font-size: .95rem; }
  a { display: inline-flex; margin-top: 24px; padding: 9px 13px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: .88rem; }
  a:hover { border-color: var(--copper); }
</style>
</head>
<body data-pagefind-ignore>
<main>
  <p class="code">404</p>
  <h1>这一页不在书架上</h1>
  <p>地址可能已经变化，或者这篇内容还没有随知识库一起发布。</p>
  <a href="/">回到知识库</a>
</main>
</body>
</html>
